# SmartPlayBuddy Web 桥接服务反代（部署在 web 所在服务器）
# 用法：软链/拷贝到 Nginx sites-enabled；对外 443(HTTPS)，对内转发 8765。
# 作用：统一对外入口（Cookie 域锚点）+ 传递真实协议供登录回跳拼址。
# 2026-09-16：与主服务器统一切 HTTPS；Certificate 域名需与前端实际访问域名一致。

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name spb.example.cn;          # 改成实际域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name spb.example.cn;          # 改成实际域名

    ssl_certificate     /etc/nginx/certs/fullchain.pem;   # 改成实际证书路径
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # 网关借此拼出正确的 https 统一登录回跳
    }
}
