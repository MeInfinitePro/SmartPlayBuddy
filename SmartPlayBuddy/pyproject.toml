[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartplaybuddy"
version = "0.1.0"
description = "A Python client for SmartPlayBuddy gamepad control."
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "websockets",
    "pyautogui",
    "keyring",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
smtplay = "smartplaybuddy.client:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# basetemp 放在工作区内，避免沙箱对系统 Temp 目录的写入限制
addopts = "--basetemp=tests/.pytest_tmp"
