# SmartPlayBuddy 服务器端反代（自建 smtplay 服务器时使用；使用现有托管则不需要）
# 关键点：/ws 必须启用 Upgrade 头，且 read_timeout 足够长，否则 WS 长连接被掐断。
#
# 2026-09-16：客户端/Mod 默认端点已统一切 HTTPS/wss
#   （https://smtplay.cabyss.cn + wss://smtplay.cabyss.cn/ws），
#   自建服务器请按本模板启用 443，否则新版客户端（默认 wss）将无法连接。
#   平台挂载页（原 :8080/mods/starrail）同样建议挂到主域名 HTTPS 路径下。

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name smtplay.example.cn;      # 改成实际域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name smtplay.example.cn;      # 改成实际域名

    ssl_certificate     /etc/nginx/certs/fullchain.pem;   # 改成实际证书路径
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HTTPS 认证服务（统一登录 / authorize / callback / refresh）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;    # 服务端借此拼出 https 回跳
    }

    # WebSocket 消息路由（设备连接 / 房间转发）—— 对应客户端 wss://<域名>/ws
    location /ws {
        proxy_pass http://127.0.0.1:2508;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
