# SmartPlayBuddy 服务器端反代（自建 smtplay 服务器时使用；使用现有托管则不需要）
# 关键点：/ws 必须启用 Upgrade 头，且 read_timeout 足够长，否则 WS 长连接被掐断。

server {
    listen 80;
    server_name smtplay.example.cn;      # 改成实际域名

    # HTTP 认证服务（统一登录 / authorize / callback / refresh）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 消息路由（设备连接 / 房间转发）
    location /ws {
        proxy_pass http://127.0.0.1:2508;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
