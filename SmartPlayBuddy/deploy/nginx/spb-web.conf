# SmartPlayBuddy Web 桥接服务反代（部署在 web 所在服务器）
# 用法：软链/拷贝到 Nginx sites-enabled；对外 80，对内转发 8765。
# 作用：统一对外入口（Cookie 域锚点）+ 传递真实协议供登录回跳拼址。

server {
    listen 80;
    server_name spb.example.cn;          # 改成实际域名或服务器 IP

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # 网关借此拼出正确的统一登录回跳
    }
}
