# Docker 部署下 Web 端的 nginx 配置（挂载进 nginx 容器）
# webapi 通过 compose 服务名访问 —— 容器 DNS 只在 spb-internal 网络内解析，
# 这本身就是第一道访问限制：外部无法解析/直达 webapi。
#
# 2026-09-16：服务器统一切 HTTPS（与 smtplay.cabyss.cn 一致）。
# 默认给出 80（直接用）+ 443（放好证书后放开）两段；启用 443 时把 80 段
# 换成文件末尾注释里的「强制跳转」写法。

server {
    listen 80;
    server_name _;                        # 改成实际域名

    # 可选：内网白名单。放开注释后，列表外 IP 全部 403。
    # allow 192.168.1.0/24;                # 宿主局域网
    # allow 10.0.0.0/8;                    # 校园网/办公网段（按需）
    # deny all;

    # 跨网段访问时大响应易被丢包/分片，开启 gzip 缩小资源体积
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://webapi:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;         # 长操作 Job 轮询不受影响
    }
}

